<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="No Meu Bairro — plataforma comunitária de Curitiba para relatos, mapa, dados, empregos e eventos." />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="No Meu Bairro" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>No Meu Bairro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- VLibras: integração oficial do Widget 6.0.0 -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script>
      (function () {
        var initialized = false;

        function initVLibras() {
          if (initialized || !window.VLibras || !window.VLibras.Widget) return;
          initialized = true;
          new window.VLibras.Widget('https://vlibras.gov.br/app');
        }

        function loadVLibras() {
          if (window.VLibras && window.VLibras.Widget) {
            initVLibras();
            return;
          }

          var existing = document.querySelector('script[data-vlibras-widget]');
          if (existing) {
            existing.addEventListener('load', initVLibras, { once: true });
            return;
          }

          var script = document.createElement('script');
          script.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
          script.async = true;
          script.crossOrigin = 'anonymous';
          script.setAttribute('data-vlibras-widget', 'true');
          script.addEventListener('load', initVLibras, { once: true });
          script.addEventListener('error', function () {
            console.error('Não foi possível carregar o VLibras. Verifique bloqueadores de conteúdo do navegador.');
          }, { once: true });
          document.head.appendChild(script);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadVLibras, { once: true });
        } else {
          loadVLibras();
        }
      })();
    </script>
  </body>
</html>
