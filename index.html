<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="No Meu Bairro — Vitória Régia, Curitiba. Plataforma comunitária para relatos, guia comercial e eventos do bairro." />
    <meta name="theme-color" content="#059669" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>No Meu Bairro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- VLibras: tradutor oficial de Português para Libras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      window.addEventListener('load', function () {
        if (window.VLibras && window.VLibras.Widget) {
          new window.VLibras.Widget('https://vlibras.gov.br/app');
        }
      });
    </script>
  </body>
</html>
