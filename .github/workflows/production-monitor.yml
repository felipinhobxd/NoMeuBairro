name: Production monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Build check']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  check-production:
    if: github.repository == 'felipinhobxd/NoMeuBairro' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted production code only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production and deliver incident or recovery notification
        run: node scripts/monitor-production.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
