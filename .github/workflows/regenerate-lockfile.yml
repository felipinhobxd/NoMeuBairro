name: Regenerate lockfile and verify npm ci

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
      - name: Verify build
        run: npm run build
      - name: Commit package-lock
        run: |
          git config user.name "No Meu Bairro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "chore: regenerate package lock"
          git push origin HEAD:main
