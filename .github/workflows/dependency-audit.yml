name: Dependency security audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade patched Vite release
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev vite@7.3.6
      - name: Apply compatible transitive security fixes
        run: npm audit fix --package-lock-only --no-audit --no-fund
      - name: Install exact audited tree
        run: npm ci --no-audit --no-fund
      - name: Re-audit all npm dependencies
        run: npm audit --audit-level=high
      - name: Verify frontend build
        run: npm run build
      - name: Commit npm security fixes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No npm dependency changes required."
          else
            git config user.name "No Meu Bairro Bot"
            git config user.email "actions@users.noreply.github.com"
            git add package.json package-lock.json
            git diff --cached --check
            git commit -m "security: update vulnerable npm dependencies"
            git push origin HEAD:main
          fi
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r backend/requirements.txt
