name: Update adaptive mobile onboarding

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-mobile-tour.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply onboarding patch
        run: python3 .github/scripts/update_mobile_tour.py
      - name: Commit onboarding update
        run: |
          git config user.name "No Meu Bairro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: adapt onboarding to mobile more menu"
          git push origin HEAD:main
