name: Apply smooth map zoom

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/smooth-map-zoom.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply smooth zoom patch
        run: python3 .github/scripts/smooth_map_zoom.py
      - name: Commit smooth zoom
        run: |
          git config user.name "No Meu Bairro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ux: smooth map zoom transitions"
          git push origin HEAD:main
