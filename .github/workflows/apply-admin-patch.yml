name: Apply admin patch

on:
  push:
    branches:
      - agent/admin-moderation-and-comments

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[admin-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-moderation-and-comments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted source patch
        run: python3 scripts/apply_admin_patch.py
      - name: Install dependencies without rewriting the existing lockfile
        run: npm install --no-package-lock
      - name: Validate production build
        run: npm run build
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/pages/Feed.tsx src/pages/Mural.tsx src/contexts/DataContext.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "[admin-patch] implement moderation and nested replies"
          git push origin HEAD:agent/admin-moderation-and-comments
