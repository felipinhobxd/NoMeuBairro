name: Apply instant map zoom

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/instant-map-zoom.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 .github/scripts/instant_map_zoom.py
      - name: Commit source patch
        run: |
          git config user.name "No Meu Bairro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: update map clusters instantly on zoom"
          git push origin HEAD:main
