name: Fix comment render

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Feed.tsx')
          text = path.read_text(encoding='utf-8')
          old = '{showDelete && ('
          new = '{(isAuthor || isPostOwner) && ('

          if old not in text:
              print('Target already fixed; nothing to do.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-comment-render.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Feed.tsx .github/workflows/fix-comment-render.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: corrige renderização dos comentários'
          git push
