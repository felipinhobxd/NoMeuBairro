name: Apply audited source fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/audit_source_fixes.py'
      - '.github/workflows/audit-source-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/audit_source_fixes.py
      - name: Validate patch
        run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "No Meu Bairro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden audited source paths"
          git push origin HEAD:main
