name: Apply focused product upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/apply_post_lifecycle.py'
      - '.github/workflows/apply-post-lifecycle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply focused patch
        run: python .github/scripts/apply_post_lifecycle.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit validated upgrade
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public database
          if [ -d supabase ]; then git add supabase; fi
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "feat: apply validated product upgrade"
          git push origin HEAD:main
