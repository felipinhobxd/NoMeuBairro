name: Update guest create-post flow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/guest-create-post.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guest create-post update
        run: python3 .github/scripts/guest_create_post.py
      - name: Commit source changes
        run: |
          git config user.name "No Meu Bairro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: keep create-post action visible for guests"
          git push origin HEAD:main
