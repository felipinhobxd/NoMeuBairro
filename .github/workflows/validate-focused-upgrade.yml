name: Validate focused upgrade

on:
  pull_request:
    paths:
      - '.github/scripts/apply_post_lifecycle.py'
      - 'src/**'
      - 'database/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply focused patch
        run: python .github/scripts/apply_post_lifecycle.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
