# ═══════════════════════════════════════════════════════════
# No Meu Bairro — Vitória Régia
# Docker Compose (Produção)
# ═══════════════════════════════════════════════════════════
#
# Uso:
#   docker compose up -d          # Inicia tudo
#   docker compose logs -f api    # Ver logs da API
#   docker compose down           # Para tudo
#   docker compose exec api flask db upgrade   # Rodar migrations
#

version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: anb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqui_no_meu_bairro
      POSTGRES_USER: anb_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-anb_senha_forte_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anb_user -d aqui_no_meu_bairro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anb-network

  # ─── Flask API ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anb-api
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-altere-esta-chave-em-producao}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-altere-esta-chave-jwt-em-producao}
      DATABASE_URL: postgresql://anb_user:${DB_PASSWORD:-anb_senha_forte_2024}@db:5432/aqui_no_meu_bairro
      RATE_LIMIT_DEFAULT: 100/hour
      RATE_LIMIT_AUTH: 5/minute
      RATE_LIMIT_DENUNCIAS: 3/hour
      UPLOAD_FOLDER: /app/uploads
      FLASK_APP: app.py
      FLASK_ENV: production
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - anb-network

  # ─── Nginx (Reverse Proxy + SSL) ───────────────────────
  nginx:
    image: nginx:alpine
    container_name: anb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - anb-network

# ─── Volumes ───────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

# ─── Network ───────────────────────────────────────────────
networks:
  anb-network:
    driver: bridge
